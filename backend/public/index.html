<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdfb">
  <meta name="description" content="拾光，用对话找到真正适合的好物。">
  <title>拾光｜购物决策助手</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="app-stage">
    <div class="phone" id="phone">
      <div class="status-bar" aria-hidden="true"><span id="clock">8:46</span><span class="status-icons"><i class="ph ph-cell-signal-full"></i><i class="ph ph-wifi-high"></i><i class="ph ph-battery-medium battery"></i></span></div>
      <header class="topbar"><button type="button" class="icon-button" id="menuButton" aria-label="打开菜单"><i class="ph ph-list"></i></button><div class="brand">拾光</div><span></span></header>
      <main class="conversation" id="conversation" aria-live="polite"></main>
      <button type="button" class="jump-bottom" id="jumpBottom" aria-label="回到底部" hidden><i class="ph ph-arrow-down"></i></button>
      <div class="dock"><form class="composer" id="composer"><button type="button" class="round add" id="addButton" aria-label="添加内容"><i class="ph ph-plus-circle"></i></button><input id="messageInput" type="text" placeholder="发送消息或按住说话…" aria-label="输入消息" autocomplete="off"><button type="submit" class="round send" id="sendButton" aria-label="发送消息"><i class="ph ph-arrow-up"></i></button></form><p class="disclaimer">内容由AI生成 · 商品信息以原平台为准</p></div>
      <div id="overlay"></div>
    </div>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
